<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STILL — Carpathian Retreat</title>
<meta name="description" content="STILL — a deeper kind of escape. Glass domes in the Carpathians.">
<meta name="theme-color" content="#050807">
<link rel="icon" href="assets/mount.png">
<style>
*{box-sizing:border-box}
body{margin:0}
/* Layout: the 1920×1080 STILL hero rendered as one stage, scaled to fit the window; WebGL for the living scene, DOM for crisp UI */
:root{
  --void:#050807;
  --chrome-bg:rgba(12,16,15,.62);
  --chrome-fg:#efe6d6;
  --chrome-line:rgba(239,230,214,.18);
  --lime:#dff250;
  --font-ui: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--void);color:var(--chrome-fg);overflow:hidden;font-family:var(--font-ui)}
#view{position:fixed;inset:0;overflow:hidden;background:var(--void)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--void)}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.ui{position:absolute;pointer-events:none}
.ui img{position:absolute;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.clip{overflow:hidden}

/* ---------- entrance states ---------- */
.rv{opacity:0;transition:opacity .9s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform 1.1s cubic-bezier(.16,1,.3,1) var(--d,0s),clip-path 1.1s cubic-bezier(.65,0,.2,1) var(--d,0s),filter .9s ease var(--d,0s)}
.go .rv{opacity:1}
.logo{clip-path:inset(0 100% 0 0)}
.go .logo{clip-path:inset(0 0 0 0)}
.navw{transform:translateY(14px);filter:blur(5px)}
.go .navw{transform:none;filter:blur(0)}
.lift{transform:translateY(16px)}
.go .lift{transform:none}
.line img{transform:translateY(110%);transition:transform 1.25s cubic-bezier(.16,1,.3,1) var(--d,0s)}
.line{opacity:1}
.go .line img{transform:translateY(0)}
.under{clip-path:inset(0 100% 0 0)}
.go .under{clip-path:inset(0 0 0 0)}
.bar{transform:translateY(46px)}
.go .bar{transform:none}
.ico{transform:scale(.7);}
.go .ico{transform:none}
.mount{clip-path:inset(100% 0 0 0)}
.go .mount{clip-path:inset(0 0 0 0)}

/* hand-written signature under STILL */
.sig{position:absolute;left:640px;top:520px;width:900px;height:300px;pointer-events:none;rotate:-5deg;
  filter:drop-shadow(0 3px 8px rgba(4,7,6,.55));
  -webkit-mask-image:linear-gradient(100deg,#000 0 46%,transparent 52%);mask-image:linear-gradient(100deg,#000 0 46%,transparent 52%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.sig svg{display:block;overflow:visible}
.sig text{font-family:"Mrs Saint Delafield","Brush Script MT",cursive;font-size:190px;fill:var(--lime);
  stroke:var(--lime);stroke-width:1.1;stroke-dasharray:900;stroke-dashoffset:900;fill-opacity:0;paint-order:stroke}
.go .sig{animation:sigReveal 2.3s cubic-bezier(.55,.05,.25,1) .55s forwards}
.go .sig text{animation:sigStroke 2.3s cubic-bezier(.55,.05,.25,1) .55s forwards,sigFill 1.4s ease 1.5s forwards}
@keyframes sigReveal{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes sigStroke{to{stroke-dashoffset:0}}
@keyframes sigFill{to{fill-opacity:1}}
@media (prefers-reduced-motion: reduce){.sig{-webkit-mask-image:none;mask-image:none}.sig text{stroke-dashoffset:0;fill-opacity:1;animation:none!important}}

/* CTA light sweep */
.sheen{position:absolute;overflow:hidden;border-radius:44px}
.sheen::after{content:"";position:absolute;top:0;bottom:0;width:180px;left:-220px;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);transform:skewX(-18deg);mix-blend-mode:soft-light}
.go .sheen::after{animation:sweep 1.3s cubic-bezier(.6,0,.2,1) 5.2s 1 both}
@keyframes sweep{to{left:520px}}

/* interactive hit areas (design untouched; only micro feedback) */
.hit{position:absolute;pointer-events:auto;cursor:pointer;border-radius:46px}
.hit:focus-visible{outline:2px solid var(--lime);outline-offset:4px}
#barWrap img,.bk img{transition:filter .5s ease}
.hot #barWrap img{filter:brightness(1.04) saturate(1.05)}

/* ---------- prototype chrome ---------- */
#chrome{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--chrome-bg);
  border:1px solid var(--chrome-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:12px;letter-spacing:.04em;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;z-index:5}
#chrome.show{opacity:1;transform:none}
#chrome .hint{opacity:.8;white-space:nowrap}
#replay{font:inherit;color:var(--void);background:var(--lime);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
#replay:focus-visible{outline:2px solid var(--chrome-fg);outline-offset:2px}
#fallback{position:fixed;inset:0;display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
@media (max-width:1280px){#chrome .hint{display:none}}
</style>

<body>

    <div class="ui clip rv ico" style="left:1722px;top:964px;width:47px;height:67px;--d:1.07s"><img src="assets/icons.png" alt="" style="left:-52px;top:0"></div>
    <div class="ui clip rv ico" style="left:1771px;top:964px;width:47px;height:67px;--d:1.14s"><img src="assets/icons.png" alt="" style="left:-101px;top:0"></div>
    <div class="ui clip rv ico" style="left:1821px;top:964px;width:46px;height:67px;--d:1.21s"><img src="assets/icons.png" alt="" style="left:-151px;top:0"></div>

    <div class="ui rv mount" style="left:50px;top:973px;width:116px;height:58px;--d:.9s"><img src="assets/mount.png" alt="" style="left:0;top:0"></div>

</div>

<div id="chrome" role="group" aria-label="Prototype controls">
  <span class="hint">Курсор — это ветер и свет</span>

</div>
<div id="fallback" hidden><p>Этому браузеру не хватает WebGL для анимации.</p></div>

<script>
(()=>{
const SRC={bg:"assets/bg.jpg",mask:"assets/mask.png",ribF:"assets/ribbonF.webp",ribB:"assets/ribbonB.webp",letters:"assets/letters.png",depth:"assets/depth.png"};
const W=1920,H=1080;
const stage=document.getElementById('stage'), cv=document.getElementById('gl'), chrome=document.getElementById('chrome');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- fit stage ---------- */
let scale=1, offX=0, offY=0;
function fit(){
  const vw=innerWidth, vh=innerHeight;
  scale=Math.min(vw/W, vh/H);
  offX=(vw-W*scale)/2; offY=(vh-H*scale)/2;
  stage.style.transform=`translate(${offX}px,${offY}px) scale(${scale})`;
  const dpr=Math.min(devicePixelRatio||1,2);
  const bw=Math.min(3840,Math.round(W*scale*dpr)), bh=Math.round(bw*H/W);
  if(cv.width!==bw){cv.width=bw;cv.height=bh;}
}
addEventListener('resize',fit); fit();

/* ---------- GL ---------- */
const gl=cv.getContext('webgl',{premultipliedAlpha:true,antialias:false,alpha:false});
if(!gl){document.getElementById('fallback').hidden=false;return;}

const VS=`attribute vec2 aPos;uniform vec4 uRect;uniform vec2 uRes;uniform float uZoom;varying vec2 vP;
void main(){vec2 p=uRect.xy+aPos*uRect.zw;vP=p;vec2 c=uRes*.5;vec2 z=c+(p-c)*uZoom;vec2 cl=z/uRes*2.-1.;cl.y=-cl.y;gl_Position=vec4(cl,0.,1.);}`;

const COMMON=`precision highp float;varying vec2 vP;uniform vec2 uRes;uniform float uT,uW,uG,uExpo;uniform vec4 uTrail[10];
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
vec3 cw(vec2 p){vec2 w=vec2(0.);float s=0.;for(int i=0;i<10;i++){vec2 d=p-uTrail[i].xy;float g=exp(-dot(d,d)/28900.);w+=uTrail[i].zw*g;s+=length(uTrail[i].zw)*g;}return vec3(w,s);}
vec3 ribD(vec2 q,float w,float ph0,vec2 P){float t=uT,W=uW,G=uG;
 float A=3.6+52.*W+16.*G, sp=1.05+5.*W+2.2*G, k=6.2831/640.;
 float env=.45+.55*smoothstep(0.,w,q.x);
 float ph=q.x*k-t*sp+ph0, ph2=ph*2.17+1.3+t*.4;
 float dy=env*A*(sin(ph)+.35*sin(ph2));
 float sl=env*A*k*(cos(ph)+.76*cos(ph2));
 float dx=env*A*.22*cos(ph*.7+.5)*smoothstep(0.,220.,q.x);
 vec3 c=cw(P);
 vec2 d=vec2(dx,dy)+c.xy*26.;
 d.y+=sin(q.x*.03-t*14.)*min(c.z,2.)*7.;
 d+=(vec2(fbm(q*.01+t*.3),fbm(q*.01-t*.3+5.))-.5)*(2.+10.*W);
 return vec3(d,sl);}`;

const FS_BG=COMMON+`uniform sampler2D uBg,uMask,uDepth,uSh;uniform vec2 uLight;uniform float uLOn;uniform vec2 uOff;uniform float uHeat;
void main(){
 vec4 dp=texture2D(uDepth,vP/uRes);vec2 p=vP-uOff*dp.r;vec2 uv=p/uRes;vec4 m=texture2D(uMask,uv);float W=uW,t=uT,HT=uHeat;
 vec3 c3=cw(p);vec2 wv=c3.xy;float ws=c3.z;
 vec2 d=vec2(0.);
 float sp=.012+W*.09;vec2 q=p*.0035;
 float n1=fbm(q+vec2(t*sp,0.)),n2=fbm(q*1.3+vec2(4.1,1.7)-vec2(t*sp*.7,0.));
 d+=m.r*(vec2((n1-.5)*(7.+55.*W),(n2-.5)*(3.+14.*W))+wv*5.);
 float fn=fbm(p*.006+vec2(t*(.06+.4*W),t*.015));
 d+=m.g*(vec2((fn-.5)*(18.+22.*W)+W*10.*sin(t*1.3),(fbm(p*.008-vec2(t*.07,0.))-.5)*9.)+wv*7.);
 float hg=clamp((p.y-640.)/440.,0.,1.);
 d.x+=m.a*(1.-hg*.65)*(sin(t*1.6+p.x*.012)*(.5+9.*W)+wv.x*5.);
 float up=clamp((872.-p.y)/115.,0.,1.);
 float fl=fbm(vec2(p.x*.03,p.y*.02+t*(2.4+3.*W)));
 d+=m.b*vec2(sin(p.y*.07+t*11.)*(1.4+4.*W)*up+wv.x*7.*up+uG*4.*up,-(fl-.4)*(7.+16.*W+14.*HT)*up-HT*10.*up);
 vec3 col=texture2D(uBg,clamp((p-d)/uRes,vec2(.0005),vec2(.9995))).rgb;
 float ev=fbm(p*.0016+vec2(t*.06,-t*.035));
 float mi=fbm(p*vec2(.0026,.0065)+vec2(-t*(.05+.32*W),t*.014)-wv*.01);
 float mi2=fbm(p*vec2(.0055,.012)+vec2(-t*(.1+.5*W),-t*.025)+7.);
 float th=.34+.26*ev;
 float mist=(smoothstep(th,th+.34,mi)*.75+smoothstep(th+.06,th+.3,mi2)*.45)*m.g*(.36+.5*W)*(1.-clamp(ws*.9,0.,.85));
 col=mix(col,vec3(.88,.86,.83),clamp(mist,0.,.85));
 float fk=.6*fbm(vec2(t*3.,0.))+.4*fbm(vec2(t*7.3,3.));
 col+=m.b*vec3(1.,.55,.2)*((fk-.45)*.32+HT*.42);
 vec2 dl=texture2D(uDepth,uv).rg;col+=dl.g*vec3(1.,.62,.28)*HT*.26;col*=1.+dl.g*HT*.2;
 vec2 fc=(p-vec2(962.,862.))/vec2(380.,170.);float gl2=exp(-dot(fc,fc));col*=1.+gl2*((fk-.5)*.14+HT*.32);col+=gl2*vec3(.30,.13,.03)*HT*.55;
 if(uLOn>.001){
  vec2 su=vec2(vP.x/uRes.x,1.-vP.y/uRes.y),tx=vec2(1.6/960.,1.6/540.);
  vec2 sh=(texture2D(uSh,su).rg*2.+texture2D(uSh,su+vec2(tx.x,0.)).rg+texture2D(uSh,su-vec2(tx.x,0.)).rg+texture2D(uSh,su+vec2(0.,tx.y)).rg+texture2D(uSh,su-vec2(0.,tx.y)).rg)/6.;float acc=sh.r*(1.-sh.g);
  float lm=length(vP-uLight)/540.;float fo=smoothstep(0.,1.,pow(.34/max(lm,.001),.75))*uLOn;
  col=mix(col,vec3(.025,.04,.045),clamp(acc*fo*1.5,0.,.86));
  vec3 lime=vec3(.87,.95,.30),amber=vec3(.97,.62,.27),ember=vec3(.80,.27,.16);
  float e=smoothstep(.0,.12,acc)*(1.-smoothstep(.12,.55,acc));
  vec3 spec=acc<.2?mix(lime,amber,smoothstep(.04,.2,acc)):mix(amber,ember,smoothstep(.2,.5,acc));
  col+=spec*e*fo*.85;
  col+=vec3(1.,.70,.40)*(1.-acc)*fo*fo*.11;
  col+=(h21(vP+fract(t))-.5)*.012*uLOn;
 }
 gl_FragColor=vec4(col*uExpo,1.);
}`;

const FS_RIB=COMMON+`uniform sampler2D uTex;uniform vec4 uImg;uniform float uPh;
void main(){
 vec2 q=vP-uImg.xy;vec3 r=ribD(q,uImg.z,uPh,vP);float sl=r.z;vec2 d=r.xy;
 vec2 uv=(q-d)/uImg.zw;
 vec4 s=texture2D(uTex,uv);
 s*=step(uv.x,1.)*step(0.,uv.y)*step(uv.y,1.);
 s.rgb*=1.+clamp(sl*.9,-.22,.3);
 gl_FragColor=vec4(s.rgb*uExpo,s.a);
}`;

const FS_LET=COMMON+`uniform sampler2D uTex,uRib;uniform vec4 uImg,uRImg;uniform float uLA,uLAmp,uRPh;
vec4 smp(vec2 q){vec2 uv=q/uImg.zw;vec4 s=texture2D(uTex,uv);return s*step(0.,uv.x)*step(uv.x,1.)*step(0.,uv.y)*step(uv.y,1.);}
void main(){
 vec2 q=vP-uImg.xy;float A=uLAmp,t=uT;vec4 s;
 if(A<.01){s=smp(q);}else{
  vec2 d=vec2(sin(q.y*.034+t*3.1)*A+sin(q.y*.105-t*4.7)*A*.38+(fbm(vec2(q.y*.012,t*.8))-.5)*A*.9,
              sin(q.x*.012+t*2.2)*A*.18);
  vec2 b=q-d;s=vec4(0.);
  for(int i=0;i<5;i++){float o=(float(i)-2.)*A*.12;s+=smp(b+vec2(o,o*.15));}
  s/=5.;
 }
 if(s.a>.003){
  vec2 sp=vP-vec2(14.,26.);vec2 rq=sp-uRImg.xy;vec3 r=ribD(rq,uRImg.z,uRPh,sp);
  vec2 ruv=(rq-r.xy)/uRImg.zw;vec2 px=1./uRImg.zw;float sh=0.;
  for(int i=0;i<3;i++)for(int j=0;j<3;j++){vec2 u2=ruv+vec2(float(i)-1.,float(j)-1.)*px*14.;
   sh+=texture2D(uRib,u2).a*step(u2.x,1.)*step(0.,u2.y)*step(u2.y,1.);}
  sh=clamp(sh/9.,0.,1.)*uLA;
  s.rgb*=mix(vec3(1.),vec3(.72,.66,.57),sh*.6);
 }
 s*=uLA;
 gl_FragColor=vec4(s.rgb*uExpo,s.a);
}`;

const FS_SH=`precision highp float;varying vec2 vP;uniform vec2 uRes,uLight;uniform sampler2D uLet;uniform vec4 uLImg;
float h1(vec3 p){return fract(sin(dot(p,vec3(489.,589.,58.)))*492.)*2.-1.;}
float letA(vec2 sp){vec2 u=(sp-uLImg.xy)/uLImg.zw;if(u.x<0.||u.y<0.||u.x>1.||u.y>1.)return 0.;return texture2D(uLet,u).a;}
void main(){vec2 p=vP;float self=letA(p);
 vec2 d=(uLight-p)/56.;vec2 rp=p+d*(h1(vec3(p*.37,1.))*.5+.5);float acc=0.;
 for(int i=0;i<56;i++){acc+=letA(rp)/56.;rp+=d;}
 gl_FragColor=vec4(acc,self,0.,1.);}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function prog(fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'aPos');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);const nm=a.name.replace('[0]','');u[nm]=gl.getUniformLocation(p,a.name);}
  return{p,u};}
let P;
try{P={bg:prog(FS_BG),rib:prog(FS_RIB),let:prog(FS_LET),sh:prog(FS_SH)};}
catch(e){console.error(e);document.getElementById('fallback').hidden=false;return;}

const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
const SHW=960,SHH=540,shTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,shTex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,SHW,SHH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const shFbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,shFbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,shTex,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);

function load(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function tex(img,pm=true){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,pm);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return{t,w:img.width,h:img.height};}

/* layer placement, measured from the original mockup */
const L={ribB:{x:0,y:233},letters:{x:99,y:323},ribF:{x:0,y:133}};

/* ---------- pointer wind ---------- */
const trail=[];let G=0,last=null;
const lt={x:1300,y:700,tx:1300,ty:700,on:0,onT:0,seen:false};
const par={x:0,y:0},parT={x:0,y:0};let heat=0,heatT=0,lastNow=0;
for(const id of ['ctaHit','bookHit']){const el=document.getElementById(id);
  el.addEventListener('pointerenter',()=>{heatT=1;stage.classList.add('hot');});el.addEventListener('pointerleave',()=>{heatT=0;stage.classList.remove('hot');});
  el.addEventListener('focus',()=>heatT=1);el.addEventListener('blur',()=>heatT=0);}
addEventListener('pointerleave',()=>{parT.x=0;parT.y=0;});
document.documentElement.addEventListener('pointerleave',()=>{lt.onT=0;parT.x=0;parT.y=0;heatT=0;});
function onMove(e){
  if(reduce)return;
  const x=(e.clientX-offX)/scale,y=(e.clientY-offY)/scale,now=performance.now();
  if(last){const dt=Math.max(8,now-last.t)/1000;let vx=(x-last.x)/dt,vy=(y-last.y)/dt;
    const sp=Math.hypot(vx,vy),cap=3200;if(sp>cap){vx*=cap/sp;vy*=cap/sp;}
    trail.push({x,y,vx,vy,t:now});if(trail.length>10)trail.shift();
    G=Math.max(G,Math.min(1,Math.hypot(vx,vy)/2600));}
  last={x,y,t:now};lt.tx=x;lt.ty=y;lt.onT=1;lt.seen=true;
  parT.x=(x/W-.5)*2;parT.y=(y/H-.5)*2;
  if(x>W-420&&y>H-220)showChrome(2500);
}
addEventListener('pointermove',onMove,{passive:true});
const TR=new Float32Array(40);

/* ---------- timeline ---------- */
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, eo=x=>1-Math.pow(1-x,3), cl=x=>Math.min(1,Math.max(0,x));
let t0=performance.now(), goTimer, chromeTimer;
function showChrome(ms){chrome.classList.add('show');clearTimeout(chromeTimer);chromeTimer=setTimeout(()=>chrome.classList.remove('show'),ms);}
const sigEl=document.getElementById('sig');
function start(){
  stage.classList.remove('go');void stage.offsetWidth;
  t0=performance.now()-(reduce?9000:0);
  clearTimeout(goTimer);goTimer=setTimeout(()=>stage.classList.add('go'),reduce?0:3150);
  if(!reduce)setTimeout(()=>showChrome(3500),6800);
}
document.getElementById('replay').addEventListener('click',start);
for(const id of ['ctaHit','bookHit'])document.getElementById(id).addEventListener('click',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К')start();});

let texs;
function draw(now){
  const t=(now-t0)/1000;
  const storm=reduce?0:(t<1.4?1:1-eio(cl((t-1.4)/2.3)));
  const expo=reduce?1:eo(cl(t/1.6));
  const zoom=reduce?1:1+.065*(1-eo(cl(t/4.2)));
  const lA=reduce?1:eo(cl((t-.3)/1.1));
  const lAmp=17*Math.pow(storm,1.4);
  const dt=Math.min(.05,Math.max(0,(now-lastNow)/1000));lastNow=now;
  G*=Math.exp(-dt/0.9);
  const ease=1-Math.exp(-dt*2.6),intro=reduce?1:eo(cl((t-3.2)/1.6));
  par.x+=(parT.x*intro-par.x)*ease;par.y+=(parT.y*intro-par.y)*ease;
  heat+=(heatT-heat)*(1-Math.exp(-dt*(heatT>heat?3.2:1.8)));
  // intro: a low sun slides behind STILL, sweeping its shadows across the sky
  const it=reduce?1:cl((t-3.3)/3.4),iOn=reduce?0:Math.sin(Math.PI*it)*(t>3.3?1:0);
  const ix=1330-760*eio(it),iy=700-60*Math.sin(Math.PI*it);
  const kl=1-Math.exp(-dt*7.5);lt.x+=(lt.tx-lt.x)*kl;lt.y+=(lt.ty-lt.y)*kl;
  lt.on+=(lt.onT*(reduce?1:eo(cl((t-3.6)/1)))-lt.on)*(1-Math.exp(-dt*4));
  const iO=iOn*(1-lt.on),lW=lt.on/Math.max(.001,lt.on+iO);
  const LX=ix+(lt.x-ix)*lW,LY=iy+(lt.y-iy)*lW,LON=Math.max(lt.on,iO);
  const DEP={ribB:14,letters:20,ribF:30};
  const pos=(k,dep)=>({x:L[k].x-par.x*dep,y:L[k].y-par.y*dep*.6});
  if(sigEl)sigEl.style.translate=`${(-par.x*26).toFixed(2)}px ${(-par.y*15).toFixed(2)}px`;
  for(let i=0;i<10;i++){const p=trail[trail.length-1-i];
    if(p){const life=Math.exp(-(now-p.t)/450);TR[i*4]=p.x;TR[i*4+1]=p.y;TR[i*4+2]=p.vx/1000*life;TR[i*4+3]=p.vy/1000*life;}
    else{TR[i*4]=-9999;TR[i*4+1]=-9999;TR[i*4+2]=0;TR[i*4+3]=0;}}
  const T=reduce?t*.35:t;

  gl.viewport(0,0,cv.width,cv.height);
  function common(pp){gl.useProgram(pp.p);const u=pp.u;
    gl.uniform2f(u.uRes,W,H);gl.uniform1f(u.uZoom,zoom);gl.uniform1f(u.uT,T);gl.uniform1f(u.uW,storm);
    gl.uniform1f(u.uG,G);gl.uniform1f(u.uExpo,expo);gl.uniform4fv(u.uTrail,TR);return u;}

  if(LON>.002){const lo=pos('letters',DEP.letters),tx=texs.letters;
    gl.bindFramebuffer(gl.FRAMEBUFFER,shFbo);gl.viewport(0,0,SHW,SHH);gl.disable(gl.BLEND);
    gl.useProgram(P.sh.p);const s=P.sh.u;gl.uniform2f(s.uRes,W,H);gl.uniform1f(s.uZoom,1);gl.uniform4f(s.uRect,0,0,W,H);
    gl.uniform4f(s.uLImg,lo.x,lo.y,tx.w,tx.h);gl.uniform2f(s.uLight,LX,LY);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tx.t);gl.uniform1i(s.uLet,0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);gl.enable(gl.BLEND);}
  // background
  let u=common(P.bg);gl.uniform4f(u.uRect,0,0,W,H);gl.uniform2f(u.uOff,-par.x*16,-par.y*9);gl.uniform1f(u.uHeat,heat);gl.uniform2f(u.uLight,LX,LY);gl.uniform1f(u.uLOn,LON);
  gl.activeTexture(gl.TEXTURE3);gl.bindTexture(gl.TEXTURE_2D,shTex);gl.uniform1i(u.uSh,3);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,texs.depth.t);gl.uniform1i(u.uDepth,2);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texs.bg.t);gl.uniform1i(u.uBg,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,texs.mask.t);gl.uniform1i(u.uMask,1);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

  const PAD=150;
  function rib(key,ph){const tx=texs[key],o=pos(key,DEP[key]);const u=common(P.rib);
    gl.uniform4f(u.uRect,o.x-PAD,o.y-PAD,tx.w+PAD*2,tx.h+PAD*2);gl.uniform4f(u.uImg,o.x,o.y,tx.w,tx.h);gl.uniform1f(u.uPh,ph);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tx.t);gl.uniform1i(u.uTex,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
  rib('ribB',2.1);

  {const tx=texs.letters,o=pos('letters',DEP.letters),rf=pos('ribF',DEP.ribF);const u=common(P.let);const pd=lAmp>0.01?80:0;
   gl.uniform4f(u.uRect,o.x-pd,o.y-pd,tx.w+pd*2,tx.h+pd*2);gl.uniform4f(u.uImg,o.x,o.y,tx.w,tx.h);
   gl.uniform1f(u.uLA,lA);gl.uniform1f(u.uLAmp,lAmp);
   gl.uniform4f(u.uRImg,rf.x,rf.y,texs.ribF.w,texs.ribF.h);gl.uniform1f(u.uRPh,0.0);
   gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,texs.ribF.t);gl.uniform1i(u.uRib,1);
   gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tx.t);gl.uniform1i(u.uTex,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

  rib('ribF',0.0);
  requestAnimationFrame(draw);
}

Promise.all(Object.entries(SRC).map(([k,s])=>load(s).then(i=>[k,i]))).then(arr=>{
  texs={};for(const[k,i] of arr)texs[k]=tex(i,k!=='mask'&&k!=='depth');
  start();requestAnimationFrame(draw);
}).catch(e=>{console.error(e);document.getElementById('fallback').hidden=false;});
})();
</script>
</body>
</html>
